<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Netcast Business Card — Front</title>
<meta name="viewport" content="width=1280" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Screen scale: 1 inch = 240 px */
    --ppi: 240;
    --bleed-w: calc(3.75 * var(--ppi) * 1px);   /* 900 */
    --bleed-h: calc(2.25 * var(--ppi) * 1px);   /* 540 */
    --trim-w:  calc(3.5  * var(--ppi) * 1px);   /* 840 */
    --trim-h:  calc(2.0  * var(--ppi) * 1px);   /* 480 */
    --trim-inset: calc(0.125 * var(--ppi) * 1px); /* 30 */
    --safe-inset: calc(0.25  * var(--ppi) * 1px); /* 60 */

    --ink-black: #000000;
    --ink-gold:  #CCAC34;   /* sampled exactly from the logo */
    --ink-white: #FFFFFF;

    --page-bg:   #ececea;
    --page-ink:  #1a1a1a;
    --page-mute: #7a7a78;
    --rule:      #d3d3cf;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", serif;
    background: var(--page-bg);
    color: var(--page-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* ─── Document chrome (the page around the card) uses sans for clarity ─── */
  .page { max-width: 1280px; margin: 0 auto; padding: 64px 80px 96px;
          font-family: "Montserrat", system-ui, sans-serif; }
  .meta {
    display: grid; grid-template-columns: 1fr auto;
    align-items: end; gap: 24px;
    padding-bottom: 24px; border-bottom: 1px solid var(--rule);
    margin-bottom: 64px;
  }
  .meta h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.18em;
             text-transform: uppercase; margin: 0 0 8px; color: var(--page-mute); }
  .meta h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  .meta .specs { display: flex; gap: 32px; font-size: 11px;
                 letter-spacing: 0.16em; text-transform: uppercase; color: var(--page-mute); }
  .meta .specs b { color: var(--page-ink); font-weight: 600; }

  .section-head {
    display: grid; grid-template-columns: auto 1fr;
    align-items: baseline; gap: 20px; margin-bottom: 40px;
  }
  .section-head .num { font-size: 11px; letter-spacing: 0.24em;
                       color: var(--page-mute); font-weight: 500; }
  .section-head h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.005em; margin: 0; }
  .section-head .sub { grid-column: 2; font-size: 13px; color: var(--page-mute);
                       margin-top: 4px; max-width: 60ch; line-height: 1.5; }

  /* ============================================================
     THE CARD — three horizontal zones, 30 / 40 / 30
     ============================================================ */
  .card {
    width: var(--bleed-w);
    height: var(--bleed-h);
    background: var(--ink-black);
    position: relative;
    overflow: hidden;
    font-family: var(--card-font, "Cormorant Garamond", serif);
    /* very subtle field warmth — invisible at first glance */
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.012), transparent 60%),
      radial-gradient(ellipse at 70% 90%, rgba(255,255,255,0.008), transparent 55%);
  }

  /* Safe content area (60px in from bleed = 30px in from trim).
     Logo hugs the top of the safe area, contact hugs the bottom, identity
     floats vertically centered in the remainder — produces even visual gaps
     between zones with the name landing at true card vertical center. */
  .card-inner {
    position: absolute;
    inset: var(--safe-inset);
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr;
    color: var(--ink-white);
  }

  /* Top zone — logo centered */
  .zone-logo {
    grid-row: 1; grid-column: 1;
    display: flex; justify-content: center; align-items: center;
  }
  .logo {
    display: block;
    width: var(--logo-w, 36%);
    height: auto;
    max-height: 90%;
    object-fit: contain;
  }

  /* Middle zone — name + title, vertically centered */
  .zone-identity {
    grid-row: 2; grid-column: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: var(--name-title-gap, 6px);
    text-align: center;
  }
  .name {
    font-family: var(--card-font, "Cormorant Garamond", serif);
    font-weight: 700;
    font-size: var(--name-size, 56px);
    line-height: 1;
    letter-spacing: -0.005em;
    color: var(--ink-gold);
    margin: 0;
  }
  .title {
    font-family: var(--card-font, "Cormorant Garamond", serif);
    font-weight: 500;
    font-size: var(--title-size, 15px);
    line-height: 1;
    letter-spacing: var(--title-track, 0.42em);
    text-transform: uppercase;
    color: var(--ink-white);
    margin: 0;
    /* compensate for tracking on last character */
    padding-left: var(--title-track, 0.42em);
  }

  /* Bottom zone — three columns, baseline-aligned, anchored to bottom.
     Outermost items sit 0.2" (48px) inside the trim line on both sides. */
  .zone-contact {
    grid-row: 3; grid-column: 1;
    display: flex;
    justify-content: space-between;
    align-items: end;
    padding-bottom: 4px;
    margin-left: 18px;
    margin-right: 18px;
  }
  .contact-item {
    font-family: var(--card-font, "Cormorant Garamond", serif);
    font-style: var(--contact-style, normal);
    font-weight: 500;
    font-size: var(--contact-size, 14px);
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--ink-white);
    white-space: nowrap;
    overflow: visible;
  }
  .contact-sep {
    font-family: var(--card-font, "Cormorant Garamond", serif);
    font-weight: 300;
    font-size: calc(var(--contact-size, 14px) * 1.15);
    line-height: 1;
    color: rgba(255,255,255,0.45);
    user-select: none;
  }

  /* ============================================================
     HERO PRESENTATION
     ============================================================ */
  .hero {
    background: linear-gradient(180deg, #e3e2dd 0%, #d8d6d0 100%);
    padding: 96px 0;
    display: flex; justify-content: center; align-items: center;
    border: 1px solid var(--rule);
  }
  .hero .card {
    /* trim size — no visible bleed in hero */
    width: var(--trim-w);
    height: var(--trim-h);
    border-radius: 4px;
    box-shadow:
      0 1px 1px rgba(0,0,0,0.18),
      0 2px 4px rgba(0,0,0,0.10),
      0 14px 28px rgba(0,0,0,0.22),
      0 32px 60px rgba(0,0,0,0.26);
  }
  .hero .card-inner { inset: calc(var(--safe-inset) - var(--trim-inset)); }

  /* ============================================================
     PRINT SPEC VIEW
     ============================================================ */
  .print { margin-top: 96px; }
  .print-stage {
    background: #fafaf8; border: 1px solid var(--rule);
    padding: 80px; display: flex; justify-content: center;
  }
  .print-frame { position: relative; width: var(--bleed-w); height: var(--bleed-h); }

  .crop { position: absolute; pointer-events: none; }
  .crop::before, .crop::after { content: ""; position: absolute; background: #1a1a1a; }
  .crop.tl { top: var(--trim-inset); left: var(--trim-inset); }
  .crop.tr { top: var(--trim-inset); right: var(--trim-inset); }
  .crop.bl { bottom: var(--trim-inset); left: var(--trim-inset); }
  .crop.br { bottom: var(--trim-inset); right: var(--trim-inset); }
  .crop.tl::before { width: 14px; height: 1px; left: -22px; top: 0; }
  .crop.tl::after  { width: 1px; height: 14px; left: 0; top: -22px; }
  .crop.tr::before { width: 14px; height: 1px; right: -22px; top: 0; }
  .crop.tr::after  { width: 1px; height: 14px; right: 0; top: -22px; }
  .crop.bl::before { width: 14px; height: 1px; left: -22px; bottom: 0; }
  .crop.bl::after  { width: 1px; height: 14px; left: 0; bottom: -22px; }
  .crop.br::before { width: 14px; height: 1px; right: -22px; bottom: 0; }
  .crop.br::after  { width: 1px; height: 14px; right: 0; bottom: -22px; }

  .guide { position: absolute; pointer-events: none; }
  .guide.trim { inset: var(--trim-inset); outline: 1px dashed rgba(255,255,255,0.55); }
  .guide.safe { inset: var(--safe-inset); outline: 1px dashed rgba(204,172,52,0.6); }

  .dim {
    position: absolute; font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--page-mute);
    font-weight: 500; white-space: nowrap;
  }
  .dim.top    { top: -34px; left: 50%; transform: translateX(-50%); }
  .dim.bottom { bottom: -34px; left: 50%; transform: translateX(-50%); }
  .dim.left   { left: -56px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: center; }
  .dim.right  { right: -56px; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: center; }

  .legend {
    margin-top: 64px; display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 32px; max-width: var(--bleed-w);
    margin-left: auto; margin-right: auto;
  }
  .legend-item { display: grid; grid-template-columns: 28px 1fr; gap: 14px; align-items: start; }
  .swatch { width: 28px; height: 0; margin-top: 8px; border-top: 1px dashed; }
  .legend-item dt { font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
                    text-transform: uppercase; margin: 0 0 4px; }
  .legend-item dd { margin: 0; font-size: 12px; color: var(--page-mute); line-height: 1.5; }

  /* ============================================================
     SPEC FOOTER — colorway + typography
     ============================================================ */
  .specs-grid {
    margin-top: 96px; display: grid; grid-template-columns: 1fr 1fr;
    gap: 64px; padding-top: 40px; border-top: 1px solid var(--rule);
  }
  .spec-block h4 {
    font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--page-mute); margin: 0 0 20px;
  }
  .color-row {
    display: grid; grid-template-columns: 56px 1fr auto;
    gap: 16px; align-items: center; padding: 12px 0;
    border-bottom: 1px solid var(--rule); font-size: 13px;
  }
  .color-row:last-child { border-bottom: none; }
  .chip { width: 56px; height: 56px; border-radius: 2px; }
  .chip.black { background: #000; }
  .chip.gold  { background: #CCAC34; }
  .chip.white { background: #fff; border: 1px solid var(--rule); }
  .color-row .name-col { font-weight: 600; }
  .color-row .mode { color: var(--page-mute); font-size: 11px; letter-spacing: 0.08em; }
  .color-row .hex { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--page-ink); }

  .type-row {
    display: grid; grid-template-columns: 140px 1fr auto;
    gap: 16px; align-items: baseline; padding: 14px 0;
    border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--page-mute);
  }
  .type-row:last-child { border-bottom: none; }
  .type-row .role { letter-spacing: 0.12em; text-transform: uppercase; font-size: 10px; }
  .type-row .sample { color: var(--page-ink); font-size: 14px;
                      font-family: var(--card-font, "Cormorant Garamond", serif); }
  .type-row .meta-col { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  .sample-name  { font-weight: 700; letter-spacing: -0.005em; font-size: 22px; color: #CCAC34 !important; }
  .sample-title { font-weight: 500; letter-spacing: 0.42em; text-transform: uppercase; font-size: 15px; }
  .sample-body  { font-weight: 500; font-size: 18px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontFamily": "Cormorant Garamond",
  "logoWidth": 29,
  "nameSize": 56,
  "titleSize": 15,
  "titleTrack": 0.42,
  "nameTitleGap": 8,
  "contactSize": 20,
  "contactItalic": false
} /*EDITMODE-END*/;

const FONT_OPTIONS = [
{ value: "Cormorant Garamond", label: "Cormorant" },
{ value: "Playfair Display", label: "Playfair" },
{ value: "Montserrat", label: "Montserrat" }];


function Card({ t, withBleed = false }) {
  const cardVars = {
    "--card-font": `"${t.fontFamily}", serif`,
    "--logo-w": `${t.logoWidth}%`,
    "--name-size": `${t.nameSize}px`,
    "--title-size": `${t.titleSize}px`,
    "--title-track": `${t.titleTrack}em`,
    "--name-title-gap": `${t.nameTitleGap}px`,
    "--contact-size": `${t.contactSize}px`,
    "--contact-style": t.contactItalic ? "italic" : "normal"
  };

  return (
    <article className="card" style={cardVars}>
      <div className="card-inner">
        <div className="zone-logo">
          <img className="logo" src="assets/netcast-logo-tight.png" alt="Netcast Marketing" />
        </div>
        <div className="zone-identity">
          <h2 className="name">Andre Lokuszta</h2>
          <p className="title">Founder &amp; CEO</p>
        </div>
        <div className="zone-contact" style={{ padding: "0px 0px 24px" }}>
          <span className="contact-item">andre@netcastmarketing.com</span>
          <span className="contact-sep">|</span>
          <span className="contact-item">linkedin.com/in/andre-lokuszta</span>
          <span className="contact-sep">|</span>
          <span className="contact-item">netcastmarketing.com</span>
        </div>
      </div>
      {withBleed &&
      <React.Fragment>
          <div className="guide trim"></div>
          <div className="guide safe"></div>
        </React.Fragment>
      }
    </article>);

}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <React.Fragment>
      <div className="page">
        <header className="meta">
          <div>
            <h1>Netcast Marketing · Business Card</h1>
            <h2>Front — Andre Lokuszta</h2>
          </div>
          <div className="specs">
            <div><b>3.75 × 2.25"</b> bleed</div>
            <div><b>3.5 × 2.0"</b> trim</div>
            <div><b>CMYK / 300 dpi</b></div>
          </div>
        </header>

        <section>
          <div className="section-head">
            <span className="num">01</span>
            <div>
              <h3>Presentation</h3>
              <p className="sub">Finished card at trim size. Three horizontal zones — logo, identity, contact — each filling its share of the height. Composition reads as a single luxury object.</p>
            </div>
          </div>
          <div className="hero"><Card t={t} /></div>
        </section>

        <section className="print">
          <div className="section-head">
            <span className="num">02</span>
            <div>
              <h3>Print specification</h3>
              <p className="sub">Full bleed canvas with trim (white dashed) and 0.125" safe area (gold dashed). Corner ticks mark the cut. CMYK at 300 DPI.</p>
            </div>
          </div>

          <div className="print-stage">
            <div className="print-frame">
              <div className="dim top">3.75" — 1125 px @ 300 dpi (bleed)</div>
              <div className="dim bottom">3.5" trim</div>
              <div className="dim left">2.25" bleed</div>
              <div className="dim right">2.0" trim</div>

              <Card t={t} withBleed />

              <span className="crop tl"></span>
              <span className="crop tr"></span>
              <span className="crop bl"></span>
              <span className="crop br"></span>
            </div>
          </div>

          <dl className="legend">
            <div className="legend-item">
              <span className="swatch" style={{ borderColor: "#1a1a1a" }}></span>
              <div>
                <dt>Bleed · 3.75 × 2.25"</dt>
                <dd>Solid matte black extends to the canvas edge. The press trims into this margin.</dd>
              </div>
            </div>
            <div className="legend-item">
              <span className="swatch" style={{ borderColor: "rgba(120,120,120,0.9)" }}></span>
              <div>
                <dt>Trim · 3.5 × 2.0"</dt>
                <dd>Finished cut line — the visible card edge.</dd>
              </div>
            </div>
            <div className="legend-item">
              <span className="swatch" style={{ borderColor: "#CCAC34" }}></span>
              <div>
                <dt>Safe · 3.25 × 1.75"</dt>
                <dd>0.125" inside the trim. All typography stays within this gold guide.</dd>
              </div>
            </div>
          </dl>
        </section>

        <section className="specs-grid">
          <div className="spec-block">
            <h4>Colorway</h4>
            <div className="color-row">
              <span className="chip black"></span>
              <div>
                <div className="name-col">Matte black</div>
                <div className="mode">FIELD · uncoated</div>
              </div>
              <div className="hex">#000000</div>
            </div>
            <div className="color-row">
              <span className="chip gold"></span>
              <div>
                <div className="name-col">Brand gold</div>
                <div className="mode">LOGO · NAME (sampled from logo)</div>
              </div>
              <div className="hex">#CCAC34</div>
            </div>
            <div className="color-row">
              <span className="chip white"></span>
              <div>
                <div className="name-col">Paper white</div>
                <div className="mode">TITLE · CONTACT</div>
              </div>
              <div className="hex">#FFFFFF</div>
            </div>
          </div>

          <div className="spec-block">
            <h4>Typography — {t.fontFamily}</h4>
            <div className="type-row">
              <span className="role">Name</span>
              <span className="sample sample-name">Andre Lokuszta</span>
              <span className="meta-col">700 / {t.nameSize}px</span>
            </div>
            <div className="type-row">
              <span className="role">Title</span>
              <span className="sample sample-title">Founder &amp; CEO</span>
              <span className="meta-col">400 / {t.titleSize}px / {t.titleTrack}em</span>
            </div>
            <div className="type-row">
              <span className="role">Contact</span>
              <span className="sample sample-body">andre@netcastmarketing.com</span>
              <span className="meta-col">500 / {t.contactSize}px / white</span>
            </div>
          </div>
        </section>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Typography" />
        <TweakRadio
          label="Family"
          value={t.fontFamily}
          options={FONT_OPTIONS}
          onChange={(v) => setTweak("fontFamily", v)} />
        
        <TweakSlider
          label="Name size"
          value={t.nameSize}
          min={36} max={72} step={1} unit="px"
          onChange={(v) => setTweak("nameSize", v)} />
        
        <TweakSlider
          label="Title size"
          value={t.titleSize}
          min={10} max={18} step={1} unit="px"
          onChange={(v) => setTweak("titleSize", v)} />
        
        <TweakSlider
          label="Title tracking"
          value={t.titleTrack}
          min={0.2} max={0.6} step={0.02} unit="em"
          onChange={(v) => setTweak("titleTrack", v)} />
        
        <TweakSlider
          label="Name → title gap"
          value={t.nameTitleGap}
          min={0} max={20} step={1} unit="px"
          onChange={(v) => setTweak("nameTitleGap", v)} />
        
        <TweakSlider
          label="Contact size"
          value={t.contactSize}
          min={14} max={30} step={1} unit="px"
          onChange={(v) => setTweak("contactSize", v)} />
        
        <TweakToggle
          label="Contact italic"
          value={t.contactItalic}
          onChange={(v) => setTweak("contactItalic", v)} />
        

        <TweakSection label="Logo" />
        <TweakSlider
          label="Logo width"
          value={t.logoWidth}
          min={22} max={48} step={1} unit="%"
          onChange={(v) => setTweak("logoWidth", v)} />
        
      </TweaksPanel>
    </React.Fragment>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
