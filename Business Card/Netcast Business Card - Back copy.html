<html lang="en">
<head>
<meta charset="utf-8" />
<title>Netcast Business Card — Back</title>
<meta name="viewport" content="width=1050" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #b2b0ab;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 60px;
    font-family: system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hint {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #545250;
    margin-bottom: 44px;
    text-align: center;
  }

  /* ── Card: 3.5 × 2.0" trim at 240 ppi = 840 × 480 px ── */
  .card {
    width: 840px;
    height: 480px;
    background: #000;
    position: relative;
    overflow: hidden;
    border-radius: 5px;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.22),
      0 4px 10px rgba(0,0,0,0.16),
      0 20px 44px rgba(0,0,0,0.32),
      0 44px 90px rgba(0,0,0,0.28);
    font-family: "Cormorant Garamond", Georgia, serif;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.012), transparent 60%),
      radial-gradient(ellipse at 70% 90%, rgba(255,255,255,0.008), transparent 55%);
  }

  /* Safe area: 60px = 0.25" from each edge */
  .card-inner {
    position: absolute;
    inset: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Centered stack: logo → tagline → QR */
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0; /* gaps set individually below */
  }

  .logo {
    display: block;
    width: 46%;         /* slightly enlarged logo */
    height: auto;
    object-fit: contain;
  }

  .tagline {
    font-weight: 400;
    font-size: 42px;   /* slightly smaller tagline */
    line-height: 1.05;
    letter-spacing: 0.01em;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    margin-top: 14px;
  }

  .qr-wrap {
    margin-top: 14px;
    width: 158px;
    height: 158px;
    flex-shrink: 0;
  }
  .qr-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated; /* keep QR crisp */
  }

  /* ── Print ── */
  @media print {
    body { background: none; padding: 0; min-height: 0; }
    .hint { display: none; }
    .card {
      box-shadow: none;
      border-radius: 0;
      width: 840px;
      height: 480px;
      zoom: 0.4;
    }
  }
</style>
</head>
